# Nginx configuration for Distributed File Sync on AWS EC2
# Location: /etc/nginx/conf.d/filesync.conf (or /etc/nginx/sites-available/filesync)
#
# TLS: obtain a certificate with a name matching the paths below, e.g.
#   certbot certonly --webroot -w /var/www/certbot --cert-name filesync -d your.domain
# JWTs and file contents must never travel over plain HTTP, so port 80 only redirects.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/filesync/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filesync/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Maximum file upload size (matches Spring Boot max-file-size)
    client_max_body_size 110M;

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # 1. Frontend SPA static files
    root /var/www/filesync/frontend/dist;
    index index.html;

    # Cache immutable static assets (hashed by Vite)
    location ~* \.(?:css|js|woff2?|svg|gif|ico|png|jpg|jpeg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing fallback: send all non-file paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2a. Server-Sent Events stream: a long-lived GET, so it needs its own
    # read timeout instead of the short one used for ordinary REST calls.
    # Buffering must be off or nginx will hold events instead of streaming them.
    location /api/sync/events {
        proxy_pass http://127.0.0.1:8080/api/sync/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # 2b. Backend REST API reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for chunked file streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 3. SpringDoc OpenAPI / Swagger UI
    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080/swagger-ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api-docs {
        proxy_pass http://127.0.0.1:8080/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

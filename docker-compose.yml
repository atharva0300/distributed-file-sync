services:
  # Optional: only needed when running several file-sync-service instances
  # (NOTIFICATIONS_BACKPLANE=redis). Start with: docker compose --profile redis up -d
  redis:
    image: redis:7-alpine
    container_name: filesync-redis
    profiles: ["redis"]
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: filesync-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-filesync}
      POSTGRES_USER: ${POSTGRES_USER:-filesync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (run ./run.sh to generate one)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-filesync}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Stateless content-addressable chunk store. Internal-only: no public port is published
  # in production (see aws/cloudformation.yml); here it's exposed on localhost for direct
  # debugging convenience only.
  storage-service:
    image: filesync-storage-service
    container_name: filesync-storage-service
    build:
      context: .
      dockerfile: storage-service/Dockerfile
    environment:
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - STORAGE_PATH=/data/storage
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-filesync-chunks}
    volumes:
      - storage_data:/data/storage
    ports:
      - "8081:8081"

  backend:
    image: filesync-backend
    container_name: filesync-backend
    build:
      context: .
      dockerfile: file-sync-service/Dockerfile
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/filesync
      - DATABASE_USERNAME=filesync
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - STORAGE_SERVICE_URL=http://storage-service:8081
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      storage-service:
        condition: service_started

volumes:
  postgres_data:
  storage_data:

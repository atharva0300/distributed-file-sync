spring:
  datasource:
    url: jdbc:tc:postgresql:15-alpine:///testdb
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

app:
  jwt:
    secret: test-secret-key-at-least-256-bits-long-for-hmac-sha256
    expiration-ms: 3600000
  storage-service:
    url: http://localhost:8081
  internal:
    api-key: test-internal-key
  sync:
    chunk-size: 1048576  # 1 MB for tests (legacy property)
    background-worker:
      fixed-delay-ms: 60000
      max-retries: 3
  chunking:
    min-size: 1           # tests upload tiny chunks
    target-size: 1048576  # 1 MB
    max-size: 1048576     # 1 MB
  upload:
    max-concurrent-sessions: 50

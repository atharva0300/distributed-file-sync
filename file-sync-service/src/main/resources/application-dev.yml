# ===========================================================
# Dev profile — runs WITHOUT Docker / external databases
# Uses H2 (in-memory SQL)
# Activate with: -Dspring.profiles.active=dev
# ===========================================================

spring:
  datasource:
    url: jdbc:h2:mem:filesync;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop   # let Hibernate create the schema from entities
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false            # H2 uses Hibernate DDL instead of Flyway migrations


logging:
  level:
    com.filesync: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

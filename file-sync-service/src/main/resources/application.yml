server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: file-sync-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/filesync}
    username: ${DATABASE_USERNAME:filesync}
    password: ${DATABASE_PASSWORD:filesync_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      repositories:
        enabled: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 110MB

  scheduling:
    enabled: true

# Application configuration
app:
  notifications:
    # local: events are pushed to this instance's SSE clients (single instance, no Redis needed).
    # redis: events go through Redis pub/sub so every instance can serve every user's SSE connection.
    backplane: ${NOTIFICATIONS_BACKPLANE:local}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-please-change-in-production-at-least-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  storage-service:
    url: ${STORAGE_SERVICE_URL:http://localhost:8081}

  internal:
    # Shared HMAC secret with storage-service (see StorageServiceClient / that service's
    # InternalAuthFilter). This dev fallback is only safe for local/dev; the aws profile
    # overrides it with a required (no-default) env var — see application-aws.yml.
    api-key: ${INTERNAL_API_KEY}

  sync:
    session-expiry-rate: ${SESSION_EXPIRY_RATE_MS:300000}
    session-cleanup-rate: ${SESSION_CLEANUP_RATE_MS:86400000}
    finalizing-recovery-rate: ${FINALIZING_RECOVERY_RATE_MS:3600000}
    background-worker:
      fixed-delay-ms: ${WORKER_FIXED_DELAY_MS:2000}
      threads: ${WORKER_THREADS:2}
      max-retries: ${WORKER_MAX_RETRIES:3}
      lease-duration-minutes: ${WORKER_LEASE_DURATION_MINUTES:10}
    gc:
      batch-size: ${GC_BATCH_SIZE:500}

  # ── Content-Defined Chunking (CDC) ───────────────────────────────────────────
  # mode: CDC uses Rabin fingerprint rolling hash for content-defined boundaries.
  # min-size:    minimum chunk size in bytes (CDC will not produce smaller chunks)
  # target-size: average/target chunk size; must be a power of two for CDC
  # max-size:    forced boundary if no content-defined boundary found within this many bytes
  chunking:
    min-size: ${CHUNKING_MIN_SIZE:2097152}    # 2 MB
    target-size: ${CHUNKING_TARGET_SIZE:4194304}  # 4 MB  (must be power of 2)
    max-size: ${CHUNKING_MAX_SIZE:8388608}    # 8 MB

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-produces-media-type: application/json

# Logging
logging:
  level:
    com.filesync: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

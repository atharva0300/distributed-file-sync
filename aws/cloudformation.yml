AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Distributed File Sync Platform - Cost-Conscious Architecture for Personal/Demo Use.
  Provisions VPC (0 NAT Gateways), Free S3 Gateway Endpoint, Encrypted S3 Bucket,
  RDS PostgreSQL (db.t3.micro Single-AZ), IAM Role, and EC2 (t3.micro).
  Tested in us-east-1; supports multi-region deployment via dynamic SSM AMI resolution.

# ==============================================================================
# COST-SAFETY, BILLING REALITIES & LIFECYCLE DISCLOSURE:
# - This template is engineered to minimize infrastructure costs for personal,
#   educational, and interview demo usage (~15-20 active hours per month).
# - It avoids high-cost architectural traps (such as NAT Gateways at ~$32.40/mo)
#   by routing all S3 object traffic over a free S3 Gateway VPC Endpoint.
# - BILLING & COST REALITIES:
#   * New AWS accounts receive $100 in AWS credits; the Free account plan can
#     be used for up to 6 months or until credits are exhausted.
#   * Charges do not apply while remaining on the Free account plan.
#   * Usage not covered by the Free plan/credits requires upgrading to the Paid plan.
#   * EC2 and RDS compute incur usage charges when running unless covered by account benefits/credits.
#   * Public IPv4 addresses on EC2 can incur hourly charges ($0.005/hour).
#   * EBS and RDS storage continue to exist and incur charges while resources remain provisioned.
#   * Do NOT assume or claim that this architecture is guaranteed to cost $0;
#     actual cost depends on your account plan/credits and active resource usage.
# - STOPPING VS. TEARDOWN NOTICE:
#   * Stopping EC2 pauses EC2 compute charges but does not remove storage or public-IP considerations.
#   * Stopping RDS pauses DB compute charges, but RDS storage (20 GB gp3) and applicable backup storage charges can continue.
#   * AWS automatically restarts a stopped RDS instance after 7 consecutive days.
#   * Deleting the CloudFormation stack is the preferred final teardown method for this temporary project.
# - TEARDOWN:
#   * 1. Empty the S3 bucket before stack deletion:
#        aws s3 rm s3://<S3BucketName> --recursive
#   * 2. Delete the CloudFormation stack after demo/interview use:
#        aws cloudformation delete-stack --stack-name filesync-prod
# ==============================================================================

Parameters:
  EnvironmentName:
    Type: String
    Default: filesync-prod
    Description: Environment prefix for all resource names.

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair to enable SSH access to the instance.

  AdminIP:
    Type: String
    Default: 192.0.2.1/32
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'
    ConstraintDescription: Must be a valid IPv4 CIDR range in format x.x.x.x/x (e.g. 203.0.113.25/32).
    Description: >-
      REQUIRED FOR SSH: The IPv4 CIDR block permitted to SSH into the EC2 instance (e.g. 203.0.113.25/32).
      Default is a dummy non-routable TEST-NET-1 IP (192.0.2.1/32) to prevent accidental open exposure.
      You MUST replace this with your public IP address in /32 CIDR format. NEVER use 0.0.0.0/0.

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'
    Description: >-
      Regional SSM parameter path to resolve the latest Amazon Linux 2023 x86_64 AMI ID.
      Dynamically resolves to the official AL2023 AMI in any deployment region (tested in us-east-1).

  DBUsername:
    Type: String
    Default: filesync_admin
    Description: Master username for RDS PostgreSQL.

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    Description: Master password for RDS PostgreSQL (min 8 characters).

  EC2InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
    Description: EC2 instance type (t3.micro x86_64, strictly compatible with the x86_64 AL2023 AMI).

  RDSInstanceType:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t4g.micro]
    Description: RDS instance type (db.t3.micro minimal instance for personal demo/interview use).

Resources:
  # ============================================================================
  # 1. NETWORKING (VPC, Subnets, Internet Gateway, 0 NAT Gateways)
  # ============================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-igw'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-az1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-az2'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-rt'

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-az1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-az2'

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-rt'

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # FREE S3 Gateway VPC Endpoint (Bypasses NAT Gateway and avoids data transfer charges)
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PublicRouteTable

  # ============================================================================
  # 2. SECURITY GROUPS
  # ============================================================================
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP, HTTPS and restricted SSH to EC2 instance
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Allow public HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow public HTTPS
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminIP
          Description: Allow SSH strictly from operator AdminIP (/32)
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ec2-sg'

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL traffic strictly from EC2 instance
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EC2SecurityGroup
          Description: Allow PostgreSQL strictly from EC2 SG
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-rds-sg'

  # ============================================================================
  # 3. AMAZON S3 STORAGE (Chunks CAS Bucket)
  # ============================================================================
  ChunksBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'filesync-chunks-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploadRule
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-chunks-bucket'

  # ============================================================================
  # 4. IAM ROLE & INSTANCE PROFILE FOR EC2
  # ============================================================================
  EC2IAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-EC2Role-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [ec2.amazonaws.com]
            Action: ['sts:AssumeRole']
      Policies:
        - PolicyName: FileSyncS3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ChunksBucket.Arn
                  - !Sub '${ChunksBucket.Arn}/*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${EnvironmentName}-EC2Profile-${AWS::Region}'
      Roles:
        - !Ref EC2IAMRole

  # ============================================================================
  # 5. RDS POSTGRESQL (db.t3.micro Single-AZ - Private Database)
  # ============================================================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for FileSync RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-db-subnet-group'

  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBName: filesync
      DBInstanceIdentifier: !Sub '${EnvironmentName}-db'
      AllocatedStorage: '20'
      StorageType: gp3
      DBInstanceClass: !Ref RDSInstanceType
      Engine: postgres
      EngineVersion: '16.3'
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      MultiAZ: false
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 1 # Minimal 1-day backup window for personal demo/interview use
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-postgres'

  # ============================================================================
  # 6. EC2 INSTANCE (t3.micro - Single Host Web & API Server)
  # ============================================================================
  EC2Instance:
    Type: AWS::EC2::Instance
    DependsOn: DatabaseInstance
    Properties:
      InstanceType: !Ref EC2InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      ImageId: !Ref LatestAmiId # Dynamically resolved Amazon Linux 2023 x86_64 AMI via SSM
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-web-app'

# ==============================================================================
# COST MANAGEMENT & TEARDOWN GUIDE (PERSONAL / INTERVIEW DEMO PROJECT):
# - Usage Pattern: Deploy this stack on-demand when actively testing or demoing.
# - Target Runtime: Run EC2 and RDS for approximately 15-20 hours per month.
# - Idle State & RDS Warning:
#   * Stopping EC2/RDS pauses compute charges, but provisioned storage (EBS & RDS gp3)
#     and applicable backup storage continue to incur charges while stopped.
#   * AWS automatically restarts stopped RDS instances after 7 consecutive days.
# - Teardown / Cleanup:
#   * Deleting the CloudFormation stack after use is the safest way to halt all ongoing
#     infrastructure charges.
#   * 1. Empty the S3 bucket before stack deletion:
#        aws s3 rm s3://<S3BucketName> --recursive
#   * 2. Delete the CloudFormation stack:
#        aws cloudformation delete-stack --stack-name filesync-prod
#     This terminates EC2, RDS, VPC, and Security Groups, halting all ongoing charges.
# ==============================================================================

Outputs:
  EC2PublicIP:
    Description: Public IP of the FileSync EC2 instance
    Value: !GetAtt EC2Instance.PublicIp

  EC2PublicDNS:
    Description: Public DNS of the FileSync EC2 instance
    Value: !GetAtt EC2Instance.PublicDnsName

  AppURL:
    Description: Application URL (Access web application in browser)
    Value: !Sub 'http://${EC2Instance.PublicIp}'

  RDSEndpoint:
    Description: JDBC Endpoint for PostgreSQL Database
    Value: !GetAtt DatabaseInstance.Endpoint.Address

  JDBCUrl:
    Description: Full JDBC connection string
    Value: !Sub 'jdbc:postgresql://${DatabaseInstance.Endpoint.Address}:5432/filesync'

  S3BucketName:
    Description: S3 Bucket Name used for Chunk Content-Addressable Storage
    Value: !Ref ChunksBucket
